openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Compliance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: record-signatures
    description: Drawn signatures on recorded checks
  - name: billing
    description: Subscription add-ons
  - name: health
    description: Health operations
  - name: audit-log
    description: Compliance change history
  - name: public-link-access
    description: Privacy-safe history of public link use
  - name: compliance-items
    description: Compliance item operations
  - name: assignees
    description: People who can be assigned work
  - name: categories
    description: Category operations
  - name: sites
    description: Site (location) operations
  - name: contractors
    description: Contractor operations
  - name: certificates
    description: Certificate operations
  - name: settings
    description: App settings
  - name: notifications
    description: Notification operations
  - name: fix-track
    description: FixTrack issue operations
  - name: storage
    description: File storage operations
  - name: fire-safety
    description: Fire safety logbook operations
  - name: equipment
    description: Equipment list and QR labels
  - name: inspection-reports
    description: Uploaded audit and inspection reports turned into track actions
  - name: track-actions
    description: Actions on each track, and the photos and videos attached to them
  - name: food-safety
    description: Kitchen / food safety diary operations
  - name: legionella
    description: Legionella water safety logbook operations (L8/HSG274)
  - name: daily-track
    description: DailyTrack daily checklist status (AM/PM checklists and manager sign-offs)
  - name: pat-track
    description: PAT testing register operations (appliance inventory and test results)
  - name: imports
    description: Reading photo and document lists into the spreadsheet imports
  - name: coshh-track
    description: COSHHTrack assessments, LEV examinations, health surveillance, monitoring and briefings
  - name: premises-track
    description: PremisesTrack premises safety inspection operations
  - name: privacy-governance
    description: Customer privacy-governance records and rights workflows
  - name: kitchen-allergens
    description: KitchenTrack ingredients, menus and allergen chart sign-offs
  - name: clients
    description: Businesses managed by ALPS consultants
  - name: setup
    description: First-run setup wizard
paths:
  /setup/team-alone:
    post:
      operationId: confirmSetupTeamAlone
      tags: [setup]
      summary: Confirm that only the business's Owners record checks for now
      description: >-
        The setup wizard's team step. Records can't start in a business that
        is still being set up until it has a Manager or Staff login, or an
        Owner confirms here that only Owners record for now. Owners and
        consultants only; consultants pass the business as clientId.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupTeamAloneResult"
        "400":
          description: No business to confirm for
        "403":
          description: Not an Owner or consultant of the business

  /setup/assist-request:
    post:
      operationId: requestSetupAssist
      tags: [setup]
      summary: Ask ALPS to enter the business's initial data (setup service)
      description: >-
        The getting-started page's offer. Emails ALPS (ADMIN_EMAIL) with the
        business, the person asking and their notes; ALPS agrees the price and
        invoices it, so nothing is charged here. One request per business:
        asking again returns the first request and sends no second email.
        Owners and consultants only; consultants pass the business as clientId.
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAssistRequestBody"
      responses:
        "200":
          description: Request sent (or already sent earlier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupAssistRequestResult"
        "400":
          description: No business, or the phone number or notes are too long
        "403":
          description: Not an Owner or consultant of the business
        "502":
          description: The email to ALPS failed; nothing was recorded
        "503":
          description: ALPS's email address is not configured on this server

  /clients/{id}/delete-test-business:
    post:
      operationId: deleteTestBusiness
      tags: [clients]
      summary: Permanently delete a test business that never paid (platform operators)
      description: >-
        Deletes the business's records and stored files at once, keeping the
        audit trail and a record of the deletion. Refused for the operator's
        own business and for any business with a subscription, a payment, an
        AI top-up or a legal hold. The business's name must be typed to confirm.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestBusinessDeletionRequest"
      responses:
        "200":
          description: The business was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestBusinessDeletionResult"
        "400":
          description: The typed name does not match the business
        "403":
          description: Not a platform operator
        "404":
          description: No such business
        "409":
          description: The operator's own business, or one that has paid, has an AI top-up, is under a legal hold or is already deleted
        "503":
          description: Deletion failed and was rolled back

  /feedback:
    get:
      operationId: listFeedbackReports
      tags: [feedback]
      summary: List feedback for the selected client (administrators only)
      parameters:
        - in: query
          name: clientId
          schema: { type: integer }
        - in: query
          name: category
          schema: { type: string, enum: [feedback, bug, feature] }
        - in: query
          name: status
          schema: { type: string, enum: [new, reviewing, resolved] }
      responses:
        "200":
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedbackReport" }
        "403":
          description: Not an administrator or not authorised for this client
  /feedback/all-businesses:
    get:
      operationId: listAllBusinessesFeedbackReports
      tags: [feedback]
      summary: Feedback from every business the consultant may open, newest first (consultants only, at most 500)
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [feedback, bug, feature] }
        - in: query
          name: status
          schema: { type: string, enum: [new, reviewing, resolved] }
      responses:
        "200":
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedbackReport" }
        "400":
          description: Invalid filter
        "403":
          description: Not a consultant
  /feedback/screenshot/request-upload:
    post:
      operationId: requestFeedbackScreenshotUpload
      tags: [feedback]
      summary: Presigned upload for a screenshot to attach to feedback (any signed-in user)
      description: >
        The returned objectPath is sent as screenshot.objectPath with the
        feedback; the image is verified and secured when the feedback is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackScreenshotUpload" }
        "400":
          description: Not a PNG, JPEG or WebP image
        "409":
          description: The business's paid storage is full (code STORAGE_FULL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: File storage is unavailable (code OBJECT_STORAGE_UNAVAILABLE)
  /feedback/{id}/screenshot:
    get:
      operationId: getFeedbackScreenshot
      tags: [feedback]
      summary: Short-lived link to a report's screenshot in the selected client (administrators only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: clientId
          schema: { type: integer }
      responses:
        "200":
          description: Download link, valid for 15 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackScreenshotLink" }
        "403":
          description: Not an administrator or not authorised for this client
        "404":
          description: Report not found or has no screenshot
  /feedback/{id}:
    patch:
      operationId: updateFeedbackReport
      tags: [feedback]
      summary: Update the status or internal response for a report in the selected client
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: clientId
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackReportUpdate" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReport" }
        "400":
          description: Invalid status or note
        "403":
          description: Not an administrator or not authorised for this client
        "404":
          description: Report not found in the selected client
        "409":
          description: >-
            The report changed after the draft was loaded (expectedRevision is
            stale). Nothing was saved; the latest saved report is returned for
            comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReportConflict" }
  /feedback/{id}/history:
    get:
      operationId: listFeedbackReportHistory
      tags: [feedback]
      summary: Review history for a report in the selected client, newest first (administrators only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: clientId
          schema: { type: integer }
      responses:
        "200":
          description: Accepted status and note changes, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedbackReviewEvent" }
        "403":
          description: Not an administrator or not authorised for this client
        "404":
          description: Report not found in the selected client
  /train-track/my-records:
    get:
      operationId: listMyTrainingRecords
      tags: [train-track]
      summary: The signed-in Viewer's own training records (their linked staff roster entry)
      responses:
        "200":
          description: Whether the account is linked to the roster, and that person's records, newest first
          content:
            application/json:
              schema:
                type: object
                required: [linked, records]
                properties:
                  linked: { type: boolean }
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/OwnTrainingRecord" }
        "403":
          description: Not a Viewer
  /train-track/my-records/{id}/sign:
    post:
      operationId: signMyTrainingRecord
      tags: [train-track]
      summary: Add the signed-in Viewer's signature to one of their own unsigned training records
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignTrainingRecordRequest" }
      responses:
        "200":
          description: The signed record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnTrainingRecord" }
        "400":
          description: No signature given
        "403":
          description: Not a Viewer
        "404":
          description: Not one of this Viewer's records
        "409":
          description: Already signed
  /train-track/my-coshh:
    get:
      operationId: listMyCoshhSignOffs
      tags: [train-track]
      summary: Current COSHH assessments the signed-in Viewer must read and sign, and those already signed
      responses:
        "200":
          description: Assessments for the Viewer's site (and department, where the assessment names departments)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCoshhSignOffs" }
        "403":
          description: Not a Viewer
  /train-track/my-coshh/{id}/sign:
    post:
      operationId: signMyCoshhAssessment
      tags: [train-track]
      summary: Sign that the signed-in Viewer has read a current COSHH assessment (writes a TrainTrack sign-off)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignTrainingRecordRequest" }
      responses:
        "200":
          description: The Viewer's assessments after signing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCoshhSignOffs" }
        "400":
          description: No signature given
        "403":
          description: Not a Viewer
        "404":
          description: Not an assessment this Viewer must sign
        "409":
          description: Already signed this revision
  /train-track/my-documents:
    get:
      operationId: listMyDocumentSignOffs
      tags: [train-track]
      summary: DocTrack documents the signed-in Viewer must read and sign, and those they have a current sign-off for
      responses:
        "200":
          description: Documents for the Viewer's department and site that staff must read and sign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDocumentSignOffs" }
        "403":
          description: Not a Viewer
  /train-track/my-documents/{id}/download-url:
    get:
      operationId: getMyDocumentDownloadUrl
      tags: [train-track]
      summary: A short-lived link to open one of the Viewer's documents to read and sign
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The download link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoshhDocumentUrl" }
        "403":
          description: Not a Viewer
        "404":
          description: Not a document this Viewer must sign
        "503":
          description: File storage is unavailable
  /train-track/my-documents/{id}/sign:
    post:
      operationId: signMyDocument
      tags: [train-track]
      summary: Sign that the signed-in Viewer has read a DocTrack document (writes a TrainTrack sign-off)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignTrainingRecordRequest" }
      responses:
        "200":
          description: The Viewer's documents after signing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDocumentSignOffs" }
        "400":
          description: No signature given
        "403":
          description: Not a Viewer
        "404":
          description: Not a document this Viewer must sign
        "409":
          description: Already signed
  /users/me/active-department:
    put:
      operationId: setActiveDepartment
      tags: [users]
      summary: Choose which of their departments a Manager with several is working in (kept for the session)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveDepartmentRequest" }
      responses:
        "200":
          description: The chosen department and all of the Manager's departments
          content:
            application/json:
              schema:
                type: object
                required: [departmentId, departmentIds]
                properties:
                  departmentId: { type: integer }
                  departmentIds:
                    type: array
                    items: { type: integer }
        "400":
          description: No department given
        "403":
          description: Not a Manager
        "404":
          description: Not one of the Manager's departments
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit-log]
      summary: List the latest changes in a compliance module
      description: Returns at most 50 changes, newest first.
      parameters:
        - in: query
          name: module
          required: true
          schema:
            type: string
            enum: [fire, legionella, kitchen, fix, safe, train, doc, incidents]
      responses:
        "200":
          description: Most recent changes in the selected module
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  /admin/business-dashboard:
    get:
      operationId: getBusinessDashboard
      tags: [billing]
      summary: New subscriptions, cancellations, plan changes, trials and module activity between two dates (platform operators only)
      description: >-
        The figures of ALPS's Monday billing digest for any dates (inclusive, UTC days).
        Without dates, the last 7 days. At most three years.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDashboard"
        "400":
          description: Invalid dates
        "403":
          description: Not a platform operator
        "503":
          description: Unavailable

  /public-link-access:
    get:
      operationId: listPublicLinkAccess
      tags: [public-link-access]
      summary: List recent public-link access for the signed-in business
      description: >-
        Client admins and consultants only. Newest first, scoped to the active
        business. Entries never include link tokens; linkRef is a short prefix
        of the stored SHA-256 fingerprint so repeat use of one link can be
        matched without exposing the credential.
      parameters:
        - in: query
          name: linkType
          required: false
          schema:
            type: string
            enum: [sign_off, contractor_portal, fix_track_action, fix_track_quote]
        - in: query
          name: actionType
          required: false
          schema:
            type: string
            enum: [view, submit]
        - in: query
          name: from
          required: false
          description: Only access at or after this instant (ISO 8601).
          schema:
            type: string
            maxLength: 40
        - in: query
          name: to
          required: false
          description: Only access before this instant (ISO 8601).
          schema:
            type: string
            maxLength: 40
        - in: query
          name: cursor
          required: false
          description: nextCursor from the previous page.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: One page of access events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLinkAccessPage"

  /assignees:
    get:
      operationId: listAssignees
      tags: [assignees]
      summary: People who can be assigned an action, FixTrack issue or compliance check
      description: Active members of the business (not viewers) who can see the site. Names only; reminders for assigned work go to that person.
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: People who can be assigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignee"
        "404":
          description: The site is not in the business, or not in the caller's department
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractor-visits:
    get:
      operationId: listContractorVisits
      tags: [contractors]
      summary: Contractor visits kept on the tracks, per site, with the contractor reminded
      description: >
        Each visit type the business's tracks cover, at each site the user can
        see: when the track says it is next due, and the compliance check
        (with its contractor) that drives the contractor reminder. Also the
        compliance check register's other checks. Each row says whether it
        has been marked "No contractor needed".
      responses:
        "200":
          description: Visit types and per-site rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorVisitsResponse"
    put:
      operationId: setContractorVisit
      tags: [contractors]
      summary: Choose the contractor reminded about a visit at a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContractorVisitRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /contractor-visits/checks/{checkId}:
    put:
      operationId: setContractorRegisterCheck
      tags: [contractors]
      summary: Choose the contractor reminded about a compliance check, or mark it as needing none
      parameters:
        - name: checkId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContractorRegisterCheckRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /certificates-outstanding:
    get:
      operationId: listCertificatesOutstanding
      tags: [contractors]
      summary: Contractor visits still waiting for their certificate
      description: >
        Compliance checks whose contractor visit happened at least
        followUpAfterDays ago with no certificate uploaded since, however old,
        at the sites the user can see. The contractor is chased every two
        weeks until chaseStopsAfterDays after the visit (chasing false after).
      responses:
        "200":
          description: Certificates outstanding, oldest visit first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificatesOutstandingResponse"

