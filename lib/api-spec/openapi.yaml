                $ref: "#/components/schemas/InspectionReportOptions"

  /inspection-reports:
    get:
      operationId: listInspectionReports
      tags: [inspection-reports]
      summary: Uploaded audit and inspection reports (Owners, Managers for their sites, consultants)
      responses:
        "200":
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectionReportSummary"
    post:
      operationId: createInspectionReport
      tags: [inspection-reports]
      summary: Register a report uploaded through /storage/uploads/request-url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionReportRequest"
      responses:
        "201":
          description: Registered report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionReport"
        "403":
          description: Not this business's upload, or a site the caller cannot use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspection-reports/{id}:
    get:
      operationId: getInspectionReport
      tags: [inspection-reports]
      summary: A report, the list being checked, and the actions created from it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionReportDetail"
        "404":
          description: Not found, or another department's report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInspectionReport
      tags: [inspection-reports]
      summary: Remove a report uploaded by mistake (only while no actions come from it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Removed
        "409":
          description: Actions were created from it, so it is kept as their evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspection-reports/{id}/read:
    post:
      operationId: readInspectionReport
      tags: [inspection-reports]
      summary: Have ComplyTrack read the report and suggest actions (needs ANTHROPIC_API_KEY)
      description: >
        Replaces the list being checked with suggestions. Nothing is created
        until the list is confirmed. 503 REPORT_READING_UNAVAILABLE when no key
        is set; 429 REPORT_READING_LIMIT past the monthly or per-report limit.
        402 AI_ADDON_REQUIRED without the AI features add-on; 429
        AI_ALLOWANCE_USED once this period's AI allowance is used.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Suggested actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionReportReading"
        "402":
          description: The business does not have the AI features add-on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Reading limit or AI allowance reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Reading reports is not switched on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspection-reports/{id}/draft:
    put:
      operationId: saveInspectionReportDraft
      tags: [inspection-reports]
      summary: Save the list of actions being checked
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionReportDraftRequest"
      responses:
        "200":
          description: Saved list
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftActions:
                    type: array
                    items:
                      $ref: "#/components/schemas/InspectionReportDraftAction"
                required: [draftActions]

  /inspection-reports/{id}/confirm:
    post:
      operationId: confirmInspectionReportActions
      tags: [inspection-reports]
      summary: Create the checked actions as open track actions linked to the report
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionReportDraftRequest"
      responses:
        "201":
          description: Created actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/InspectionReportAction"
                  emailedTo:
                    type: array
                    description: Owners, Managers and linked consultants emailed the action plan
                    items:
                      type: string
                required: [actions, emailedTo]

  /inspection-reports/{id}/file:
    get:
      operationId: downloadInspectionReport
      tags: [inspection-reports]
      summary: Download the uploaded report
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The report file
          content:
            application/octet-stream:
