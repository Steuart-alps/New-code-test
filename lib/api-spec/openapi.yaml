          type: string
          nullable: true
          enum: [unsatisfactory, open_defects, certificate_outstanding]
        openDefectCount:
          type: integer
          description: Open C1/C2/FI/ID/AR defects on the newest certificate.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
