          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments:
                    type: array
                    items: { $ref: "#/components/schemas/CoshhSignOffStatus" }
                required: [assessments]
  /coshh-track/assessments/{id}/sign-offs:
    post:
      operationId: recordCoshhSignOffs
      tags: [coshh-track]
      summary: Record staff signing that they have read a current COSHH assessment; each writes a TrainTrack sign-off
      parameters:
        - in: path
