openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Compliance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: compliance-items
    description: Compliance item operations
  - name: categories
    description: Category operations
  - name: sites
    description: Site (location) operations
  - name: contractors
    description: Contractor operations
  - name: certificates
    description: Certificate operations
  - name: settings
    description: App settings
  - name: notifications
    description: Notification operations
  - name: storage
    description: File storage operations
  - name: fire-safety
    description: Fire safety logbook operations
  - name: food-safety
    description: Kitchen / food safety diary operations
  - name: legionella
    description: Legionella water safety logbook operations (L8/HSG274)
  - name: pat-track
    description: PAT testing register operations (appliance inventory and test results)
  - name: premises-track
    description: PremisesTrack premises safety inspection operations
  - name: privacy-governance
    description: Customer privacy-governance records and rights workflows
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors:
    get:
      operationId: listContractors
      tags: [contractors]
      summary: List all contractors
      responses:
        "200":
          description: List of contractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contractor"
    post:
      operationId: createContractor
      tags: [contractors]
      summary: Create a contractor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "201":
          description: Created contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"

  /contractors/{id}:
    get:
      operationId: getContractor
      tags: [contractors]
      summary: Get a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContractor
      tags: [contractors]
      summary: Update a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "200":
          description: Updated contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractor
      tags: [contractors]
      summary: Delete a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors/{contractorId}/certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates for a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Add a certificate to a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /contractors/{contractorId}/certificates/{id}:
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /items/{itemId}/certificates:
    get:
      operationId: listItemCertificates
      tags: [certificates]
      summary: List certificates for a compliance item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createItemCertificate
      tags: [certificates]
      summary: Add a certificate to a compliance item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /items/{itemId}/certificates/{id}:
    put:
      operationId: updateItemCertificate
      tags: [certificates]
      summary: Update a compliance item's certificate
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteItemCertificate
      tags: [certificates]
      summary: Delete a compliance item's certificate
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items:
    get:
      operationId: listComplianceItems
      tags: [compliance-items]
      summary: List all compliance items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - name: siteId
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: contractorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of compliance items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceItem"
    post:
      operationId: createComplianceItem
      tags: [compliance-items]
      summary: Create a compliance item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplianceItemRequest"
      responses:
        "201":
          description: Created compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"

  /compliance-items/{id}:
    get:
      operationId: getComplianceItem
      tags: [compliance-items]
      summary: Get a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateComplianceItem
      tags: [compliance-items]
      summary: Update a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceItemRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComplianceItem
      tags: [compliance-items]
      summary: Delete a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items/{id}/status:
    patch:
      operationId: updateComplianceItemStatus
      tags: [compliance-items]
      summary: Update compliance item status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [compliance-items]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all app settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /privacy-governance:
    get:
      operationId: getPrivacyGovernance
      tags: [privacy-governance]
      summary: Get the current client's privacy-governance records
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Privacy profile, processing records, rights requests and incident records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyGovernanceResponse"

  /privacy-governance/program:
    put:
      operationId: savePrivacyProgram
      tags: [privacy-governance]
      summary: Save the client's controller and processor responsibilities
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyProgramInput"
      responses:
        "200":
          description: Saved privacy profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyProgram"

  /privacy-governance/records:
    post:
      operationId: createPrivacyRecord
      tags: [privacy-governance]
      summary: Add a processing, rights, retention, processor or breach record
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRecordInput"
      responses:
        "201":
          description: Created privacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRecord"

  /privacy-governance/records/{kind}/{id}:
    put:
      operationId: updatePrivacyRecord
      tags: [privacy-governance]
      summary: Update a privacy record without changing its tenant
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [activity, rights_request, retention, processor, breach]
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRecordInput"
      responses:
        "200":
          description: Updated privacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRecord"

  /privacy-governance/retention-schedules/{id}/verifications:
    post:
      operationId: addPrivacyRetentionVerification
      tags: [privacy-governance]
      summary: Record evidence of deletion, an active legal hold or a deletion exception
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRetentionVerificationInput"
      responses:
        "201":
          description: Recorded verification evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRetentionVerification"

  /storage/usage:
    get:
      operationId: getStorageUsage
      tags: [storage]
      summary: Get storage usage for the current account
      responses:
        "200":
          description: Current retained storage usage and warning configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"

  /notifications/send-reminders:
    post:
      operationId: sendReminders
      tags: [notifications]
      summary: Send email reminders to contractors with upcoming due dates
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRemindersResponse"

  /notifications/send-reminder/{itemId}:
    post:
      operationId: sendReminderForItem
      tags: [notifications]
      summary: Send an email reminder for a single compliance check
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /notifications/test-email:
    post:
      operationId: testEmail
      tags: [notifications]
      summary: Send a test email to verify SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /fire-safety:
    get:
      operationId: listFireSafetyChecks
      tags: [fire-safety]
      summary: List fire safety logbook entries
      parameters:
        - in: query
          name: checkType
          schema:
            $ref: "#/components/schemas/FireCheckType"
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: List of fire safety checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyCheck"
    post:
      operationId: createFireSafetyCheck
      tags: [fire-safety]
      summary: Record a fire safety check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFireSafetyCheckRequest"
      responses:
        "201":
          description: Created check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyCheck"

  /fire-safety/status:
    get:
      operationId: getFireSafetyStatus
      tags: [fire-safety]
      summary: Per-check-type due status (last done, next due, overdue flags)
      parameters:
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: Status per check type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyStatus"

  /fire-safety/{id}:
    put:
      operationId: updateFireSafetyCheck
      tags: [fire-safety]
      summary: Update a fire safety check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFireSafetyCheckRequest"
      responses:
        "200":
          description: Updated check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyCheck"
    delete:
      operationId: deleteFireSafetyCheck
      tags: [fire-safety]
      summary: Delete a fire safety check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /food-safety/config:
    get:
      operationId: getFoodSafetyConfig
      tags: [food-safety]
      summary: Get kitchen configuration (fridge/freezer counts, temperature limits)
      parameters:
        - in: query
          name: siteId
          description: >-
            When provided, returns the effective config for that site
            (defaults ← client-level ← site-level) plus which keys are
            overridden at the site level via _siteOverrides.
          schema:
            type: integer
      responses:
        "200":
          description: Kitchen configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"
    put:
      operationId: updateFoodSafetyConfig
      tags: [food-safety]
      summary: Update kitchen configuration
      description: >-
        Only keys present in the body are written. A key sent with value null
        clears that key: for a site-scoped PUT (with siteId) it removes the
        site override so the key inherits the client-level value; for a
        client-level PUT it removes the stored value so the key reverts to the
        default.
      parameters:
        - in: query
          name: siteId
          description: When provided, writes site-scoped overrides for that site.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSafetyConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
    delete:
      operationId: resetFoodSafetyConfig
      tags: [food-safety]
      summary: Reset kitchen configuration to defaults
      parameters:
        - in: query
          name: siteId
          description: >-
            When provided, clears only that site's overrides. Without it,
            resets the client-level template to defaults.
          schema:
            type: integer
      responses:
        "200":
          description: Reset to defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"

  /fire-safety/config:
    get:
      operationId: getFireSafetyConfig
      tags: [fire-safety]
      summary: Get Fire safety configuration
      parameters:
        - in: query
          name: siteId
          description: Return the site-specific FireTrack control profile.
          schema:
