          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /certificates/reading:
    get:
      operationId: getCertificateReading
      tags: [certificates]
      summary: Whether ComplyTrack can read an uploaded certificate, and the AI allowance (owners and ALPS)
      responses:
        "200":
          description: Reading status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateReadingStatus"

  /certificates/read:
    post:
      operationId: readCertificate
      tags: [certificates]
      summary: Read a certificate with AI (owners and ALPS)
      description: >-
        Claude reads the certificate (an EICR, gas safety record, fire alarm
        service certificate and so on) and says which compliance check it is
        for, its issue and next inspection dates, its outcome and its defects.
        Nothing is saved: the person checks the reading and saves it with
        POST /items/{itemId}/certificates (remedialJob true). The file is not
        stored here. Off until the server has an Anthropic API key; it uses the
        AI features add-on's allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateReadRequest"
      responses:
        "200":
          description: What the certificate says
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateReading"
        "400":
          description: The file cannot be read here
        "402":
          description: The business does not have the AI features add-on (code AI_ADDON_REQUIRED)
        "404":
          description: The chosen check is not one of the caller's
        "429":
          description: The business has used its AI allowance (code AI_ALLOWANCE_USED)
        "502":
          description: The certificate could not be read just now
        "503":
          description: Reading is not switched on (no Anthropic API key)

  /certificate-inbox:
    get:
      operationId: getCertificateInbox
      tags: [certificates]
      summary: Certificates to confirm, and the business's certificate address (owners and ALPS)
      description: >-
        Certificates emailed to the business's certificate address, or uploaded
        by a contractor through the "Upload certificate" link in their emails,
        waiting for someone to check and save them. The address is null until
        emailed certificates are switched on for the platform.
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInbox"

  /certificate-inbox/address:
    post:
      operationId: changeCertificateInboxAddress
      tags: [certificates]
      summary: Give the business a new certificate address; the old one stops working
      responses:
        "200":
          description: The inbox with its new address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateInbox"
        "503":
          description: Emailed certificates are not switched on

  /certificate-inbox/{id}/read:
    post:
      operationId: readCertificateInboxItem
      tags: [certificates]
      summary: Read a waiting certificate with AI (again), or accept one from an unknown sender
      parameters:
        - name: id
          in: path
          required: true
          schema:
