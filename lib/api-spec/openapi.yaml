openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Compliance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: compliance-items
    description: Compliance item operations
  - name: categories
    description: Category operations
  - name: contractors
    description: Contractor operations
  - name: certificates
    description: Certificate operations
  - name: settings
    description: App settings
  - name: notifications
    description: Notification operations
  - name: storage
    description: File storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors:
    get:
      operationId: listContractors
      tags: [contractors]
      summary: List all contractors
      responses:
        "200":
          description: List of contractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contractor"
    post:
      operationId: createContractor
      tags: [contractors]
      summary: Create a contractor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "201":
          description: Created contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"

  /contractors/{id}:
    get:
      operationId: getContractor
      tags: [contractors]
      summary: Get a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContractor
      tags: [contractors]
      summary: Update a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "200":
          description: Updated contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractor
      tags: [contractors]
      summary: Delete a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors/{contractorId}/certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates for a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Add a certificate to a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /contractors/{contractorId}/certificates/{id}:
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items:
    get:
      operationId: listComplianceItems
      tags: [compliance-items]
      summary: List all compliance items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: contractorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of compliance items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceItem"
    post:
      operationId: createComplianceItem
      tags: [compliance-items]
      summary: Create a compliance item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplianceItemRequest"
      responses:
        "201":
          description: Created compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"

  /compliance-items/{id}:
    get:
      operationId: getComplianceItem
      tags: [compliance-items]
      summary: Get a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateComplianceItem
      tags: [compliance-items]
      summary: Update a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceItemRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComplianceItem
      tags: [compliance-items]
      summary: Delete a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items/{id}/status:
    patch:
      operationId: updateComplianceItemStatus
      tags: [compliance-items]
      summary: Update compliance item status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [compliance-items]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all app settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /notifications/send-reminders:
    post:
      operationId: sendReminders
      tags: [notifications]
      summary: Send email reminders to contractors with upcoming due dates
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRemindersResponse"

  /notifications/test-email:
    post:
      operationId: testEmail
      tags: [notifications]
      summary: Send a test email to verify SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - createdAt

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
      required:
        - name
        - color

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    Contractor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt

    CreateContractorRequest:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
        - email

    Certificate:
      type: object
      properties:
        id:
          type: integer
        contractorId:
          type: integer
        name:
          type: string
        fileUrl:
          type: string
          nullable: true
        issueDate:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - contractorId
        - name
        - createdAt

    CreateCertificateRequest:
      type: object
      properties:
        name:
          type: string
        fileUrl:
          type: string
          nullable: true
        issueDate:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name

    ComplianceItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, critical]
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        categoryColor:
          type: string
          nullable: true
        contractorId:
          type: integer
          nullable: true
        contractorName:
          type: string
          nullable: true
        contractorEmail:
          type: string
          nullable: true
        assignedTo:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        leadTimeDays:
          type: integer
          nullable: true
        notificationSentAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - priority
        - createdAt
        - updatedAt

    CreateComplianceItemRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
          default: pending
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        categoryId:
          type: integer
          nullable: true
        contractorId:
          type: integer
          nullable: true
        assignedTo:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        leadTimeDays:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - title

    UpdateComplianceItemRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high, critical]
        categoryId:
          type: integer
          nullable: true
        contractorId:
          type: integer
          nullable: true
        assignedTo:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        leadTimeDays:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
      required:
        - status

    DashboardStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        inProgress:
          type: integer
        completed:
          type: integer
        overdue:
          type: integer
        criticalItems:
          type: integer
        dueSoon:
          type: integer
        completionRate:
          type: number
        contractorsCount:
          type: integer
        certificatesExpiringSoon:
          type: integer
      required:
        - total
        - pending
        - inProgress
        - completed
        - overdue
        - criticalItems
        - dueSoon
        - completionRate
        - contractorsCount
        - certificatesExpiringSoon

    AppSettings:
      type: object
      properties:
        smtpHost:
          type: string
          nullable: true
        smtpPort:
          type: string
          nullable: true
        smtpUser:
          type: string
          nullable: true
        smtpPass:
          type: string
          nullable: true
        smtpFrom:
          type: string
          nullable: true
        smtpFromName:
          type: string
          nullable: true
        defaultLeadTimeDays:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true

    SendRemindersResponse:
      type: object
      properties:
        sent:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        details:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: integer
              title:
                type: string
              contractorEmail:
                type: string
              status:
                type: string
                enum: [sent, skipped, error]
              reason:
                type: string
                nullable: true
            required:
              - itemId
              - title
              - contractorEmail
              - status
      required:
        - sent
        - skipped
        - errors
        - details

    TestEmailRequest:
      type: object
      properties:
        to:
          type: string
      required:
        - to

    TestEmailResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath
