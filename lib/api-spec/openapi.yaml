          type: string
          nullable: true
          description: Weekly alarm tests. The call point tested (copied from the list, or typed when the site has none).
        nightStaff:
          type: string
          nullable: true
          enum: [included, not_included, no_night_staff]
          description: Fire drills. Whether night staff took part.
        drillTime:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Fire drills. The time of the drill (HH:MM, the business's local time). Required on new drills.
        evacuationSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 86400
          description: Fire drills. How long everyone took to evacuate, in seconds. Required on new drills.
        staffPresentIds:
          type: array
          description: Fire drills. Roster ids of the staff present. On an update, leaving it out keeps the list as recorded.
          maxItems: 2000
          items:
            type: integer
        soundLevelDb:
          type: number
          nullable: true
          description: Weekly alarm tests, optional. The sound level heard, in dB (20 to 140).
        soundLevelMethod:
          type: string
          nullable: true
          enum: [meter, phone]
          description: How the sound level was taken. "meter" is read off a sound meter; "phone" is a rough reading from the phone's microphone. Defaults to "meter" when a level is given.
        soundLevelBedhead:
          type: boolean
          nullable: true
          description: Whether the sound level was taken at a bedhead in a sleeping area (75 dB needed) rather than a general area (65 dB).

