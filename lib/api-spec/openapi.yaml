    get:
      operationId: getFoodSafetySummary
      tags: [food-safety]
      summary: Get daily food safety diary completeness for a month
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: siteId
          description: Scope to a site's diary. Omit for the whole-organisation diary.
          schema:
            type: integer
      responses:
        "200":
          description: Completeness status for every calendar day in the requested month
          content:
