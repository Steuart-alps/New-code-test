      parameters:
        - in: query
          name: siteId
          description: >-
            Scope to a site's diary. Omit for the whole-organisation diary
            (records with no site). Must belong to the caller's client.
          schema:
            type: integer
        - in: query
          name: date
          description: When provided, returns the single record for that date in the given scope (or null).
