      enum: [satisfactory, unsatisfactory, not_stated]
      description: Overall result stated on the certificate. Only satisfactory or not_stated (legacy) certificates move the check's due date.

    CertificateDefectCode:
      type: string
      enum: [C1, C2, C3, FI, ID, AR, other]
      description: EICR C1 danger present, C2 potentially dangerous, C3 improvement recommended, FI further investigation; gas ID immediately dangerous, AR at risk.

    CertificateDefect:
      type: object
      properties:
        id:
          type: integer
        certificateId:
          type: integer
        code:
          $ref: "#/components/schemas/CertificateDefectCode"
        label:
          type: string
        description:
          type: string
        location:
          type: string
          nullable: true
        fixTrackIssueId:
          type: integer
          nullable: true
        fixTrackStatus:
          type: string
          nullable: true
        fixTrackPriority:
          type: string
          nullable: true
        fixTrackTargetDate:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        blocking:
          type: boolean
          description: C1/C2/FI/ID/AR defects keep the check needing action while open.
        open:
          type: boolean
          description: The FixTrack job is not resolved or closed (or, without a job, the defect is not marked remedied).
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - certificateId
        - code
        - label
        - description
        - blocking
        - open
        - createdAt

    CreateCertificateDefectRequest:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/CertificateDefectCode"
        description:
          type: string
          minLength: 1
          maxLength: 1000
        location:
          type: string
          nullable: true
          maxLength: 300
      required:
        - code
        - description

    UpdateCertificateDefectRequest:
      type: object
      properties:
        resolved:
          type: boolean
      required:
        - resolved

    CreateItemCertificateRequest:
      type: object
      properties:
        name:
          type: string
        fileUrl:
          type: string
          nullable: true
        issueDate:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        outcome:
          $ref: "#/components/schemas/CertificateOutcome"
        defects:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateItemCertificateDefectRequest"
        remedialJob:
          type: boolean
          description: >-
            The defects that need work share one FixTrack job (so one quote
            request covers them) and the others open no job. Without it each
            defect opens its own job.
        readByAi:
          type: boolean
          description: The details were read by ComplyTrack's AI and checked by the person saving them.
      required:
        - name

    CreateItemCertificateDefectRequest:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/CertificateDefectCode"
        description:
          type: string
          minLength: 1
          maxLength: 1000
        location:
          type: string
          nullable: true
          maxLength: 300
        needsWork:
          type: boolean
          description: With remedialJob, whether it goes into the remedial job. Left out, C1, C2, FI, ID and AR do.
      required:
        - code
        - description

    CertificateReadingStatus:
      type: object
      properties:
        available:
          type: boolean
          description: False until the server has an Anthropic API key.
        ai:
          $ref: "#/components/schemas/AiStatus"
        fixTrack:
          type: boolean
          description: Whether the business has FixTrack, where remedial work and quotes live.
      required: [available, ai, fixTrack]

    CertificateReadRequest:
      type: object
      additionalProperties: false
      properties:
        fileName: { type: string, maxLength: 255 }
        mimeType: { type: string, description: "application/pdf, image/jpeg, image/png, image/webp, image/gif, .docx or text/plain" }
        data: { type: string, description: "The file as base64 (15 MB at most before encoding)" }
        itemId: { type: integer, nullable: true, description: "The check the certificate is for, when the person opened the reader from one" }
      required: [fileName, mimeType, data]

    CertificateReadingDefect:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/CertificateDefectCode"
        description: { type: string }
        location: { type: string, nullable: true }
        reference: { type: string, nullable: true, description: "The item or observation number on the certificate" }
        needsWork: { type: boolean, description: "Remedial work: C1, C2, FI, ID, AR, or other work the certificate requires. C3s never are." }
      required: [code, description, location, reference, needsWork]

    CertificateReadingNewCheck:
      type: object
      properties:
        title: { type: string }
        frequencyMonths: { type: integer, nullable: true }
      required: [title, frequencyMonths]

    CertificateReading:
      type: object
      properties:
        certificateType: { type: string }
        name: { type: string, description: "A name to file the certificate under" }
        itemId: { type: integer, nullable: true, description: "The check it is for; null when none fits" }
        checkReason: { type: string }
        newCheck:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CertificateReadingNewCheck"
          description: When no check fits, the check to create for it.
        contractorName: { type: string, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        nextInspectionDate: { type: string, format: date, nullable: true }
        nextInspectionSource:
          type: string
          nullable: true
          enum: [certificate, repeat, null]
          description: '"certificate" when it states the date; "repeat" when worked out from the check''s repeat interval.'
        outcome:
          $ref: "#/components/schemas/CertificateOutcome"
        summary: { type: string }
        defects:
          type: array
          items:
            $ref: "#/components/schemas/CertificateReadingDefect"
        unclear:
          type: array
          items: { type: string }
          description: Things that could not be read with confidence.
      required: [certificateType, name, itemId, checkReason, newCheck, contractorName, issueDate, nextInspectionDate, nextInspectionSource, outcome, summary, defects, unclear]

    CreateRecordSignatureRequest:
      type: object
      properties:
        strokes:
