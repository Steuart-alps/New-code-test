    delete:
      operationId: disablePrivacyIntakeLink
      tags: [privacy-governance]
      summary: Turn off the online privacy-request form
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Updated privacy profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyProgram"

  /privacy-governance/intake-assignee:
    put:
      operationId: setPrivacyIntakeAssignee
