          type: string
          pattern: "^[0-9]+$"
          nullable: true
        storageAutoTopUp:
          type: string
          enum: ["true", "false"]
          nullable: true
          description: '"true" adds 10 GB of storage automatically when the paid storage is full; otherwise new uploads stop there.'
        ownerUpdateFrequency:
          type: string
          enum: ["weekly", "daily", "monthly"]
          nullable: true
          description: How often Owners get the update email listing what is overdue, due and expiring. Unset means weekly (Mondays); monthly is the first Monday of each month, and Managers then still get theirs weekly.
        reminderTimings:
          type: string
          nullable: true
          description: 'JSON object keyed by reminder type (track module, "tasks", "contractors", "train"), each {"daysBefore": number|"next_week"|null, "overdueEvery": number}: how many days before the due or expiry date the personal reminder email lists it (null = off; "next_week" = in a Friday email of what is due the following week) and how often it repeats once overdue (0 = only the day after). Types left out use the defaults: 1 day before (30 for training, the contractor lead time for contractor documents) and every 7 days when overdue.'

    StorageLimitState:
      type: string
      enum: [ok, nearly_full, full, not_limited]
      description: Usage against the storage the business pays for. nearly_full is 80% or more; full stops new uploads unless automatic top-up adds storage; not_limited means no paid limit applies (no live subscription, or it couldn't be read).

    StorageStatus:
      type: object
      required: [state, canManage, autoTopUp, usedBytes, capacityBytes]
      properties:
        state:
          $ref: "#/components/schemas/StorageLimitState"
        canManage:
          type: boolean
          description: Whether this user can add storage or change automatic top-up.
        autoTopUp:
          type: boolean
        usedBytes:
          type: ["integer", "null"]
          minimum: 0
          description: Only for users who can manage storage.
        capacityBytes:
          type: ["integer", "null"]
          minimum: 0
          description: Only for users who can manage storage, and null when not limited.

    StorageUsage:
      type: object
      required:
        - usedBytes
        - objectCount
        - warningThresholdBytes
        - warning
        - monthlyDownloadBytes
        - monthlyDownloadTrackingAvailable
        - month
        - estimatedCost
        - usageCheckedAt
        - usageAgeSeconds
        - usageRefreshing
        - capacityBytes
        - limitState
        - autoTopUp
      properties:
        usedBytes:
          type: integer
          minimum: 0
        capacityBytes:
          type: ["integer", "null"]
          minimum: 0
          description: The storage the business pays for (plan allowance plus extra storage); null when uploads aren't limited.
        limitState:
          $ref: "#/components/schemas/StorageLimitState"
        autoTopUp:
          type: boolean
          description: Whether automatic 10 GB top-up is switched on.
        usageCheckedAt:
          type: ["string", "null"]
          format: date-time
          description: When the totals were last reconciled with the storage provider; null before the first check.
        usageAgeSeconds:
          type: ["integer", "null"]
          minimum: 0
          description: Seconds since usageCheckedAt. Uploads and deletions since then are already included.
        usageRefreshing:
          type: boolean
          description: A reconciliation with the storage provider is running; totals may change shortly.
        objectCount:
          type: integer
          minimum: 0
        warningThresholdBytes:
          type: integer
          minimum: 1
        warning:
          type: boolean
        monthlyDownloadBytes:
          type: ["integer", "null"]
          minimum: 0
        monthlyDownloadTrackingAvailable:
          type: boolean
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        estimatedCost:
          type: object
          nullable: true
          required: [currency, storageMinorUnits, downloadMinorUnits, totalMinorUnits, includedStorageBytes, excessStorageBytes, providerMinorUnits, markupMinorUnits, markupPercent]
          properties:
            currency:
              type: string
              enum: [USD]
            storageMinorUnits:
              type: integer
              minimum: 0
            downloadMinorUnits:
              type: integer
              minimum: 0
            totalMinorUnits:
              type: integer
              minimum: 0
            includedStorageBytes:
              type: integer
              minimum: 0
            excessStorageBytes:
              type: integer
              minimum: 0
            providerMinorUnits:
              type: integer
              minimum: 0
            markupMinorUnits:
              type: integer
              minimum: 0
            markupPercent:
              type: number
              minimum: 0

