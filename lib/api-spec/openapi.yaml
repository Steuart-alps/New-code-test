openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Compliance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: compliance-items
    description: Compliance item operations
  - name: categories
    description: Category operations
  - name: sites
    description: Site (location) operations
  - name: contractors
    description: Contractor operations
  - name: certificates
    description: Certificate operations
  - name: settings
    description: App settings
  - name: notifications
    description: Notification operations
  - name: storage
    description: File storage operations
  - name: fire-safety
    description: Fire safety logbook operations
  - name: food-safety
    description: Kitchen / food safety diary operations
  - name: legionella
    description: Legionella water safety logbook operations (L8/HSG274)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors:
    get:
      operationId: listContractors
      tags: [contractors]
      summary: List all contractors
      responses:
        "200":
          description: List of contractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contractor"
    post:
      operationId: createContractor
      tags: [contractors]
      summary: Create a contractor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "201":
          description: Created contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"

  /contractors/{id}:
    get:
      operationId: getContractor
      tags: [contractors]
      summary: Get a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateContractor
      tags: [contractors]
      summary: Update a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractorRequest"
      responses:
        "200":
          description: Updated contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contractor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractor
      tags: [contractors]
      summary: Delete a contractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contractors/{contractorId}/certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates for a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Add a certificate to a contractor
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /contractors/{contractorId}/certificates/{id}:
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      parameters:
        - name: contractorId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /items/{itemId}/certificates:
    get:
      operationId: listItemCertificates
      tags: [certificates]
      summary: List certificates for a compliance item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createItemCertificate
      tags: [certificates]
      summary: Add a certificate to a compliance item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /items/{itemId}/certificates/{id}:
    put:
      operationId: updateItemCertificate
      tags: [certificates]
      summary: Update a compliance item's certificate
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteItemCertificate
      tags: [certificates]
      summary: Delete a compliance item's certificate
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items:
    get:
      operationId: listComplianceItems
      tags: [compliance-items]
      summary: List all compliance items
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, overdue]
        - name: siteId
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: contractorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of compliance items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceItem"
    post:
      operationId: createComplianceItem
      tags: [compliance-items]
      summary: Create a compliance item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplianceItemRequest"
      responses:
        "201":
          description: Created compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"

  /compliance-items/{id}:
    get:
      operationId: getComplianceItem
      tags: [compliance-items]
      summary: Get a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateComplianceItem
      tags: [compliance-items]
      summary: Update a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceItemRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComplianceItem
      tags: [compliance-items]
      summary: Delete a compliance item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /compliance-items/{id}/status:
    patch:
      operationId: updateComplianceItemStatus
      tags: [compliance-items]
      summary: Update compliance item status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Updated compliance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [compliance-items]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all app settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /notifications/send-reminders:
    post:
      operationId: sendReminders
      tags: [notifications]
      summary: Send email reminders to contractors with upcoming due dates
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRemindersResponse"

  /notifications/send-reminder/{itemId}:
    post:
      operationId: sendReminderForItem
      tags: [notifications]
      summary: Send an email reminder for a single compliance check
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /notifications/test-email:
    post:
      operationId: testEmail
      tags: [notifications]
      summary: Send a test email to verify SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /fire-safety:
    get:
      operationId: listFireSafetyChecks
      tags: [fire-safety]
      summary: List fire safety logbook entries
      parameters:
        - in: query
          name: checkType
          schema:
            $ref: "#/components/schemas/FireCheckType"
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: List of fire safety checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyCheck"
    post:
      operationId: createFireSafetyCheck
      tags: [fire-safety]
      summary: Record a fire safety check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFireSafetyCheckRequest"
      responses:
        "201":
          description: Created check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyCheck"

  /fire-safety/status:
    get:
      operationId: getFireSafetyStatus
      tags: [fire-safety]
      summary: Per-check-type due status (last done, next due, overdue flags)
      parameters:
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: Status per check type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyStatus"

  /fire-safety/{id}:
    put:
      operationId: updateFireSafetyCheck
      tags: [fire-safety]
      summary: Update a fire safety check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFireSafetyCheckRequest"
      responses:
        "200":
          description: Updated check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyCheck"
    delete:
      operationId: deleteFireSafetyCheck
      tags: [fire-safety]
      summary: Delete a fire safety check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /food-safety/config:
    get:
      operationId: getFoodSafetyConfig
      tags: [food-safety]
      summary: Get kitchen configuration (fridge/freezer counts, temperature limits)
      responses:
        "200":
          description: Kitchen configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"
    put:
      operationId: updateFoodSafetyConfig
      tags: [food-safety]
      summary: Update kitchen configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSafetyConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
    delete:
      operationId: resetFoodSafetyConfig
      tags: [food-safety]
      summary: Reset kitchen configuration to defaults
      responses:
        "200":
          description: Reset to defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"

  /fire-safety/config:
    get:
      operationId: getFireSafetyConfig
      tags: [fire-safety]
      summary: Get Fire safety configuration
      responses:
        "200":
          description: Fire safety configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyConfig"
    put:
      operationId: updateFireSafetyConfig
      tags: [fire-safety]
      summary: Update Fire safety configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireSafetyConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyConfig"

  /legionella/config:
    get:
      operationId: getLegionellaConfig
      tags: [legionella]
      summary: Get Water safety configuration
      responses:
        "200":
          description: Water safety configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegionellaConfig"
    put:
      operationId: updateLegionellaConfig
      tags: [legionella]
      summary: Update Water safety configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegionellaConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegionellaConfig"

  /bike-track/config:
    get:
      operationId: getBikeTrackConfig
      tags: [bike-track]
      summary: Get Bike hire configuration
      responses:
        "200":
          description: Bike hire configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BikeTrackConfig"
    put:
      operationId: updateBikeTrackConfig
      tags: [bike-track]
      summary: Update Bike hire configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BikeTrackConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BikeTrackConfig"

  /green-track/config:
    get:
      operationId: getGreenTrackConfig
      tags: [green-track]
      summary: Get GreenTrack configuration
      responses:
        "200":
          description: GreenTrack configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreenTrackConfig"
    put:
      operationId: updateGreenTrackConfig
      tags: [green-track]
      summary: Update GreenTrack configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GreenTrackConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreenTrackConfig"

  /incidents/config:
    get:
      operationId: getIncidentConfig
      tags: [incidents]
      summary: Get Incident configuration
      responses:
        "200":
          description: Incident configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentConfig"
    put:
      operationId: updateIncidentConfig
      tags: [incidents]
      summary: Update Incident configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentConfig"

  /pat-track/config:
    get:
      operationId: getPATTrackConfig
      tags: [pat-track]
      summary: Get PAT testing configuration
      responses:
        "200":
          description: PAT testing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PATTrackConfig"
    put:
      operationId: updatePATTrackConfig
      tags: [pat-track]
      summary: Update PAT testing configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PATTrackConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PATTrackConfig"

  /pool-track/config:
    get:
      operationId: getPoolTrackConfig
      tags: [pool-track]
      summary: Get Pool configuration
      responses:
        "200":
          description: Pool configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolTrackConfig"
    put:
      operationId: updatePoolTrackConfig
      tags: [pool-track]
      summary: Update Pool configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolTrackConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolTrackConfig"

  /food-safety:
    get:
      operationId: listFoodSafetyRecords
      tags: [food-safety]
      summary: List food safety diary record summaries (dates and submission state)
      responses:
        "200":
          description: List of record summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoodSafetyRecordSummary"
    post:
      operationId: createFoodSafetyRecord
      tags: [food-safety]
      summary: Create a daily food safety record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFoodSafetyRecordRequest"
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyRecord"

  /food-safety/by-date/{date}:
    get:
      operationId: getFoodSafetyRecordByDate
      tags: [food-safety]
      summary: Get the food safety record for a specific date
      parameters:
        - in: path
          name: date
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Record for the date (null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyRecord"
        "404":
          description: No record for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /food-safety/{id}:
    put:
      operationId: updateFoodSafetyRecord
      tags: [food-safety]
      summary: Update a food safety record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFoodSafetyRecordRequest"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyRecord"

  /legionella:
    get:
      operationId: listLegionellaChecks
      tags: [legionella]
      summary: List Legionella water safety logbook entries
      parameters:
        - in: query
          name: checkType
          schema:
            $ref: "#/components/schemas/LegionellaCheckType"
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: List of Legionella checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegionellaCheck"
    post:
      operationId: createLegionellaCheck
      tags: [legionella]
      summary: Record a Legionella water safety check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLegionellaCheckRequest"
      responses:
        "201":
          description: Created check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegionellaCheck"

  /legionella/status:
    get:
      operationId: getLegionellaStatus
      tags: [legionella]
      summary: Per-check-type due status for Legionella (last done, next due, overdue)
      parameters:
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: Status per check type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegionellaStatus"

  /legionella/{id}:
    put:
      operationId: updateLegionellaCheck
      tags: [legionella]
      summary: Update a Legionella check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLegionellaCheckRequest"
      responses:
        "200":
          description: Updated check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegionellaCheck"
    delete:
      operationId: deleteLegionellaCheck
      tags: [legionella]
      summary: Delete a Legionella check entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

