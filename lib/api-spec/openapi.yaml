      summary: Choose the administrator assigned to online privacy requests
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyIntakeAssigneeInput"
      responses:
        "200":
          description: Updated privacy profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyProgram"

  /privacy-intake/{token}:
    get:
      operationId: getPrivacyIntakeForm
