          required: [available, monthlyLimit, usedThisMonth, ai]
      required: [reportTypes, modules, sites, assignees, reading]

    AiStatus:
      type: object
      description: >-
        The AI features add-on for this business: £15 a month, which includes
        a monthly allowance of AI use (plus any top-ups). Unused allowance and top-ups carry over, oldest
        used first, and lapse 12 months after the end of the month they were for. Without it, AI buttons are unavailable.
        A business with no trial end (every module free, set up by ALPS) has the monthly allowance included ("included").
      properties:
        configured: { type: boolean, description: "The server has an Anthropic API key, so AI can be offered at all" }
        active: { type: boolean, description: "The business has the AI add-on (or a trial allowance) now" }
        plan: { type: string, enum: [addon, trial, included, none] }
        percentUsed: { type: integer, minimum: 0, maximum: 100, description: "Share of what is available this period, allowance carried over included, that is used" }
        resetsAt: { type: string, format: date-time, nullable: true, description: "When the next month's allowance is added" }
        usedUp: { type: boolean, description: "Everything available, allowance carried over included, is used up" }
        carriedOverPercent: { type: integer, minimum: 0, description: "Unused allowance carried over from earlier months, as a share of one month's allowance (150 = a month and a half)" }
        nextLapseAt: { type: string, format: date-time, nullable: true, description: "When the oldest carried-over allowance lapses if unused" }
        nextLapsePercent: { type: integer, minimum: 0, description: "How much lapses then, as a share of one month's allowance" }
      required: [configured, active, plan, percentUsed, resetsAt, usedUp, carriedOverPercent, nextLapseAt, nextLapsePercent]

    AiAddonStatus:
      allOf:
        - $ref: "#/components/schemas/AiStatus"
        - type: object
          properties:
            price:
              type: object
              nullable: true
              properties:
                unitAmount: { type: integer, description: "Monthly price in pence, before VAT" }
                currency: { type: string }
              required: [unitAmount, currency]
            purchasable: { type: boolean, description: "The add-on can be bought now (Stripe ready and the price exists)" }
            topUp:
              type: object
              nullable: true
              description: >-
                The top-up an owner can buy now; null unless the add-on is on and billing is ready.
                On an included allowance (plan "included") the owner agrees to it and ALPS adds the price to their consultancy invoice.
              properties:
                amount: { type: integer, description: "Price in pence, before VAT, charged at once (or invoiced by ALPS on an included allowance)" }
                allowance: { type: integer, description: "AI use it adds, in pence, until the add-on renews" }
                currency: { type: string }
              required: [amount, allowance, currency]
            topUpsThisPeriod: { type: integer, minimum: 0, description: "Top-ups paid for since the add-on last renewed" }
            autoTopUp: { type: boolean, description: "A top-up is bought automatically when the allowance runs out" }
            autoTopUpLimit: { type: integer, minimum: 0, description: "Most automatic top-ups in one period" }
          required: [price, purchasable, topUp, topUpsThisPeriod, autoTopUp, autoTopUpLimit]

    AiAddonChange:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [add, remove, top_up, auto_top_up] }
        requestId: { type: string, description: "top_up only: a new UUID for each purchase, reused on retry" }
        enabled: { type: boolean, description: "auto_top_up only: switch automatic top-ups on or off" }
      required: [action]

