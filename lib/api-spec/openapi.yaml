          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organisation name and privacy notice for the form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyIntakeForm"
        "404":
          description: The link is not active
    post:
      operationId: submitPrivacyIntakeRequest
      tags: [privacy-governance]
      summary: Public - submit a privacy rights request for staff review
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyIntakeSubmission"
      responses:
        "201":
          description: Request received as unverified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyIntakeReceipt"
        "404":
          description: The link is not active
        "429":
          description: Too many submissions

  /privacy-governance/records:
    post:
      operationId: createPrivacyRecord
      tags: [privacy-governance]
      summary: Add a processing, rights, retention, processor or breach record
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRecordInput"
      responses:
        "201":
          description: Created privacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRecord"

  /privacy-governance/records/{kind}/{id}:
    put:
      operationId: updatePrivacyRecord
      tags: [privacy-governance]
      summary: Update a privacy record without changing its tenant
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: kind
          in: path
