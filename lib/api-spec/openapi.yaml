components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - createdAt

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required:
        - name

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    Site:
      type: object
      properties:
        departmentId:
          type: integer
          nullable: true
        id:
          type: integer
        clientId:
          type: integer
        name:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - name
        - createdAt
        - updatedAt

    CreateSiteRequest:
      type: object
      properties:
        departmentId:
          type: integer
          nullable: true
        name:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
      required:
        - name

    UpdateSiteRequest:
      type: object
      properties:
        departmentId:
          type: integer
          nullable: true
        name:
          type: string
        responsiblePerson:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    Contractor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        gasSafeNumber:
          type: string
          nullable: true
        publicLiabilityExpiry:
          type: string
          format: date
          nullable: true
        dbsCheckDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
