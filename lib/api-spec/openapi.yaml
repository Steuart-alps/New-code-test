  /record-signatures:
    post:
      operationId: createRecordSignature
      tags: [record-signatures]
      summary: Store the logged-in user's drawn signature for the check they are saving (not Viewers)
      description: >-
        Returns a one-use token. The web app sends the save again with the
        token in the X-Record-Signature header after the API answered it with
        428 SIGNATURE_REQUIRED; the signature is then linked to the saved
        record. Unused signatures are removed after a day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordSignatureRequest"
      responses:
        "201":
          description: The token to send with the save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordSignatureToken"
        "400":
          description: No usable drawing
    get:
      operationId: listRecordSignatures
      tags: [record-signatures]
      summary: Signatures on recorded checks of one type, for history lists
      parameters:
        - name: recordType
          in: query
          required: true
          schema:
            type: string
        - name: ids
          in: query
          required: true
          description: Up to 200 record ids, comma separated
          schema:
            type: string
      responses:
        "200":
          description: The signatures, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordSignature"

