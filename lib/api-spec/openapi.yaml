        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRecordInput"
      responses:
        "200":
          description: Updated privacy record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRecord"

  /privacy-governance/retention-schedules/{id}/verifications:
    post:
      operationId: addPrivacyRetentionVerification
      tags: [privacy-governance]
      summary: Record evidence of deletion, an active legal hold or a deletion exception
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRetentionVerificationInput"
      responses:
        "201":
          description: Recorded verification evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRetentionVerification"

  /storage/usage:
    get:
      operationId: getStorageUsage
      tags: [storage]
      summary: Get storage usage for the current account
      responses:
        "200":
          description: Current retained storage usage and warning configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"

  /storage/status:
    get:
      operationId: getStorageStatus
      tags: [storage]
      summary: Whether this business's storage is nearly full or full, for the in-app banner
      responses:
        "200":
          description: Storage limit state for the signed-in user's business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"

  /notifications/send-reminders:
    post:
      operationId: sendReminders
      tags: [notifications]
      summary: Send email reminders to contractors with upcoming due dates
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRemindersResponse"

  /notifications/send-reminder/{itemId}:
    post:
      operationId: sendReminderForItem
      tags: [notifications]
      summary: Send an email reminder for a single compliance check
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /notifications/test-email:
    post:
      operationId: testEmail
      tags: [notifications]
      summary: Send a test email to verify SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "409":
          description: The business's paid storage is full (code STORAGE_FULL) and automatic top-up is off or failed. Every upload-link route answers the same way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /track-actions/{id}/request-upload:
    post:
      operationId: requestTrackActionMediaUpload
      tags: [track-actions]
      summary: Request a signed upload URL for a photo or video on an unresolved action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackActionMediaUploadRequest"
      responses:
        "200":
          description: Signed upload URL and the object path to attach afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackActionMediaUploadResponse"
        "400":
          description: Not a JPEG, PNG, WebP, MP4, MOV or WebM file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The action is resolved, or the business's paid storage is full (code STORAGE_FULL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /track-actions/{id}/media:
    post:
      operationId: attachTrackActionMedia
      tags: [track-actions]
      summary: Check an uploaded photo or video and attach it to an unresolved action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackActionMediaAttachRequest"
      responses:
        "200":
          description: The action's photos and videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackActionMediaList"
        "400":
          description: The file is not a valid photo or video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action or uploaded file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The action is resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fix-track/issues/{id}/media/delete:
    post:
      operationId: deleteFixTrackIssueMedia
      tags: [fix-track]
      summary: Delete a photo or video from a resolved or closed issue (owners and admins)
      description: >
        Frees storage once an issue is finished. The issue, its notes and its
        history stay; the history records who deleted which file and when.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixTrackMediaDeleteRequest"
      responses:
        "200":
          description: The issue's remaining photos and videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixTrackIssueMediaList"
        "403":
          description: Not an owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The issue is not resolved or closed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fix-track/issues/{id}/assign-contractor:
    post:
      operationId: assignFixTrackContractor
      tags: [fix-track]
      summary: Give a job to a contractor and email it to them (managers)
      description: >
        A manager picks a contractor from the business's list, or adds a new
        one, and the job email (details, photos, a link to pick a visit date
        and a "job done" link) is sent straight away. The manager's choice is
        the approval, so the email does not wait in Contractor Approvals. If
        sending fails, the email stays in Contractor Approvals to retry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixTrackAssignContractorRequest"
      responses:
        "200":
          description: The job was emailed to the contractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixTrackAssignContractorResult"
        "400":
          description: No contractor chosen, an unknown contractor, or one without an email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a manager (staff ask for approval instead)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The issue is resolved, an email is being sent, or the job was already emailed and replace was not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The email could not be sent; it waits in Contractor Approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fire-safety:
    get:
      operationId: listFireSafetyChecks
      tags: [fire-safety]
      summary: List fire safety logbook entries
      parameters:
        - in: query
          name: checkType
          schema:
            $ref: "#/components/schemas/FireCheckType"
        - in: query
          name: siteId
          schema:
            type: integer
      responses:
        "200":
          description: List of fire safety checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyCheck"
    post:
      operationId: createFireSafetyCheck
      tags: [fire-safety]
      summary: Record a fire safety check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFireSafetyCheckRequest"
      responses:
        "201":
          description: Created check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireSafetyCheck"

  /fire-safety/status:
    get:
      operationId: getFireSafetyStatus
      tags: [fire-safety]
      summary: Per-check-type due status (last done, next due, overdue flags)
      parameters:
        - in: query
          name: siteId
          description: Use the site's checks and its risk-assessed frequencies.
          schema:
            type: integer
      responses:
        "200":
          description: Status per check type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireSafetyStatus"
        "400":
          description: The site is not one of this client's sites
        "403":
          description: The site belongs to a department the caller cannot see

  /fire-safety/drill-attendance:
    get:
      operationId: getFireDrillAttendance
      tags: [fire-safety]
      summary: Active roster staff with the latest fire drill each took part in
      parameters:
        - in: query
          name: siteId
          description: Staff at this site and staff with no site. Omit for every visible member.
          schema:
            type: integer
      responses:
        "200":
          description: Staff fire drill attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireDrillAttendance"
        "400":
          description: The site is not one of this client's sites
        "403":
          description: The caller is a viewer, or the site belongs to a department the caller cannot see

  /fire-safety/call-points:
    get:
      operationId: listFireCallPoints
      tags: [fire-safety]
      summary: List manual call points with when each was last tested
      parameters:
        - in: query
          name: siteId
          description: A site id, or "none" for call points not tied to a site. Omit for every visible site.
          schema:
            type: string
        - in: query
          name: includeArchived
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Call points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireCallPoint"
    post:
      operationId: createFireCallPoint
      tags: [fire-safety]
      summary: Add a manual call point (managers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFireCallPointRequest"
      responses:
        "201":
          description: Created call point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireCallPoint"
        "409":
          description: The site already has a call point with that name

  /fire-safety/call-points/order:
    put:
      operationId: orderFireCallPoints
      tags: [fire-safety]
      summary: Set a site's call point rotation order (managers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFireCallPointsRequest"
      responses:
        "200":
          description: The site's call points in use, in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FireCallPoint"
        "409":
          description: The list does not match the site's call points in use (it changed meanwhile)

  /imports/fire-call-points/template:
    get:
      operationId: getFireCallPointImportTemplate
      tags: [fire-safety]
      summary: Download the CSV template for uploading a call point list (managers)
      responses:
        "200":
          description: CSV template
          content:
            text/csv:
              schema:
                type: string

  /imports/fire-call-points:
    post:
      operationId: importFireCallPoints
      tags: [fire-safety]
      summary: Preview or import a spreadsheet of call points (managers)
      description: >-
        The browser sends the spreadsheet's header row and cell text. With
        preview true (the default) nothing is written; otherwise every row is
        written in one go, only when no row has an error. New call points join
        the end of their site's rotation in file order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireCallPointImportRequest"
      responses:
        "200":
          description: What each row did, or would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireCallPointImportResult"
        "400":
          description: The file is missing a required column or has no rows
        "409":
          description: Nothing was imported because some rows have errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireCallPointImportResult"

  /billing/ai:
    get:
      operationId: getAiAddon
      tags: [billing]
      summary: The AI features add-on, whether this business has it, and how much of its allowance is used
      responses:
        "200":
          description: AI add-on status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAddonStatus"
    post:
      operationId: changeAiAddon
      tags: [billing]
      summary: Switch the AI features add-on on or off, buy a top-up, or set automatic top-ups (owners and consultants)
      description: >-
        add puts one £15 monthly item on the subscription and charges the first
        month at once (nothing is switched on if the charge fails). remove takes
        it off at once with no refund. top_up charges a one-off top-up at once
        and adds its AI use until the add-on renews; the same requestId never
        charges twice. auto_top_up switches automatic top-ups on or off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAddonChange"
      responses:
        "200":
          description: The AI add-on status after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAddonStatus"
        "400":
          description: No live subscription yet, or a missing requestId or enabled
        "409":
          description: Already on, already off, the add-on is off (top-ups), or a top-up with this requestId is still being charged
        "502":
          description: The first month's or the top-up's charge failed or could not be confirmed
        "503":
          description: Billing or the add-on price is not ready

  /imports/pat-appliances/reading:
    get:
      operationId: getPatRegisterReading
      tags: [pat-track]
      summary: Whether ComplyTrack can read a photo or document of an appliance list, and this month's use
      responses:
        "200":
          description: Reading status and the sites the caller can import into
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatRegisterReadingStatus"

  /imports/pat-appliances/read:
    post:
      operationId: readPatRegisterList
      tags: [pat-track]
      summary: Read a photo, scan, PDF or Word list of appliances into register rows (managers)
      description: >-
        Claude reads the file and returns rows in the PAT appliance import's
        columns. Nothing is saved: the browser sends the rows to
        POST /imports/pat-appliances for the usual preview and import. The
        file is not stored. Off until the server has an Anthropic API key;
        each business has a monthly number of readings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatRegisterReadRequest"
      responses:
        "200":
          description: The rows read from the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatRegisterReadResult"
        "400":
          description: The file cannot be read here, or the site is not one of the caller's
        "402":
          description: The business does not have the AI features add-on (code AI_ADDON_REQUIRED)
        "429":
          description: This business has used its readings for the month, or its AI allowance (code AI_ALLOWANCE_USED)
        "502":
          description: The file could not be read just now
        "503":
          description: Reading is not switched on (no Anthropic API key)

  /imports/list-reading/{kind}:
    get:
      operationId: getImportListReading
      tags: [imports]
      summary: Whether ComplyTrack can read a photo or document list for an import, and this month's use
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [room-track-rooms, contractors, fire-call-points, greentrack-equipment, staff-roster]
      responses:
        "200":
          description: Reading status and the sites the caller can import into
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatRegisterReadingStatus"
        "404":
          description: Not one of the imports that can read a list

  /imports/list-reading/{kind}/read:
    post:
      operationId: readImportList
      tags: [imports]
      summary: Read a photo, scan, PDF or Word list into rows for an import (owners and consultants)
      description: >-
        Claude reads the file and returns rows in the import's own columns
        (RoomTrack rooms, contractors, FireTrack call points, GreenTrack
        equipment or the staff roster). Nothing is saved: the browser sends
        the rows through the import's usual preview. The file is not stored.
        Off until the server has an Anthropic API key; readings share the
        business's monthly number with the PAT register reading.
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [room-track-rooms, contractors, fire-call-points, greentrack-equipment, staff-roster]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatRegisterReadRequest"
      responses:
        "200":
          description: The rows read from the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportListReadResult"
        "400":
          description: The file cannot be read here, or the site is not one of the caller's
        "402":
          description: The business does not have the AI features add-on (code AI_ADDON_REQUIRED)
        "404":
          description: Not one of the imports that can read a list
        "429":
          description: This business has used its readings for the month, or its AI allowance (code AI_ALLOWANCE_USED)
        "502":
          description: The file could not be read just now
        "503":
          description: Reading is not switched on (no Anthropic API key)

  /fire-safety/call-points/{id}:
    put:
      operationId: updateFireCallPoint
      tags: [fire-safety]
      summary: Rename, move, archive or restore a call point (managers)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFireCallPointRequest"
      responses:
        "200":
          description: Updated call point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireCallPoint"

  /fire-safety/{id}:
