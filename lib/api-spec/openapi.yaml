  /food-safety/config:
    get:
      operationId: getFoodSafetyConfig
      tags: [food-safety]
      summary: Get kitchen configuration (fridge/freezer counts, temperature limits)
      parameters:
        - in: query
          name: siteId
          description: >-
            When provided, returns the effective config for that site
            (defaults ← client-level ← site-level) plus which keys are
            overridden at the site level via _siteOverrides.
          schema:
            type: integer
      responses:
        "200":
          description: Kitchen configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"
    put:
      operationId: updateFoodSafetyConfig
      tags: [food-safety]
      summary: Update kitchen configuration
      description: >-
        Only keys present in the body are written. A key sent with value null
        clears that key: for a site-scoped PUT (with siteId) it removes the
        site override so the key inherits the client-level value; for a
        client-level PUT it removes the stored value so the key reverts to the
        default.
      parameters:
        - in: query
          name: siteId
          description: When provided, writes site-scoped overrides for that site.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSafetyConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
    delete:
      operationId: resetFoodSafetyConfig
      tags: [food-safety]
      summary: Reset kitchen configuration to defaults
      parameters:
        - in: query
          name: siteId
          description: >-
            When provided, clears only that site's overrides. Without it,
            resets the client-level template to defaults.
          schema:
            type: integer
      responses:
        "200":
          description: Reset to defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyConfig"

