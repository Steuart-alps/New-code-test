    get:
      operationId: getFoodSafetyRecordByDate
      tags: [food-safety]
      summary: Get the food safety record for a specific date
      parameters:
        - in: path
          name: date
          required: true
          schema:
            type: string
        - in: query
          name: siteId
          description: Scope to a site's diary. Omit for the whole-organisation diary.
          schema:
            type: integer
      responses:
        "200":
          description: Record for the date (null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyRecord"
        "404":
          description: No record for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

