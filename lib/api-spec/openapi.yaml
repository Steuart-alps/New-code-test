    post:
      operationId: recordFoodSafetyColdReading
      tags: [food-safety]
      summary: Record one fridge or freezer reading in the day's diary
      description: >-
        Fills one unit's AM or PM reading in the day's diary, creating the
        diary (with every fridge and freezer on the list) when needed. Used by
        "Say it" voice logging. A reading already recorded is never
        overwritten (409 READING_ALREADY_RECORDED), a submitted diary is not
        changed (409 DIARY_SUBMITTED), and a reading outside the limits needs
        the corrective action taken (400 KITCHEN_CORRECTIVE_ACTION_REQUIRED).
      parameters:
        - in: query
          name: siteId
          description: Scope to a site's diary. Omit for the whole-organisation diary.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodSafetyColdReadingRequest"
      responses:
        "201":
          description: The diary with the reading added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSafetyRecord"

