          description: How many were newly signed (people who need not sign, or already have, are skipped) and the assessment's status
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed: { type: integer }
                  assessment:
                    oneOf:
                      - $ref: "#/components/schemas/CoshhSignOffStatus"
