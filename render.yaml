# Render Blueprint: one always-on web service plus PostgreSQL, both in Frankfurt.
# The API server also serves the web app, so the whole product is one process.
#
# Deploy sequence: buildCommand, then preDeployCommand (creates the base schema
# on an empty database, otherwise does nothing), then startCommand (the API runs
# its runtime migrations on boot).
#
# Cost: web "starter" and Postgres "basic-256mb" are Render's cheapest plans
# that stay on (free web services sleep, free databases expire after 30 days).

services:
  - type: web
    name: complytrack
    runtime: node
    region: frankfurt
    plan: starter
    autoDeploy: true
    # Render's Node install is read-only, so pnpm runs through npx rather
    # than a global install.
    buildCommand: >-
      npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false &&
      PORT=5173 BASE_PATH=/ npx --yes pnpm@10.28.0 --filter @workspace/compliance-tracker run build &&
      npx --yes pnpm@10.28.0 --filter @workspace/api-server run build
    preDeployCommand: node lib/db/bootstrap.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    # /readyz stays 503 until Stripe is configured, so the platform health
    # check uses /healthz, which is 503 until runtime migrations finish (a
    # failed migration exits, so a broken deploy is never promoted).
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: complytrack-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Set both to https://complytrack.alpsconsultancy.co.uk once that domain is live
      # on this service; until then the app uses Render's onrender.com address
      # (RENDER_EXTERNAL_URL). With PUBLIC_SITE_URL set, web pages requested on
      # the onrender.com address redirect there (API paths do not).
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      # Billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Optional: a hand-made Stripe price for extra storage. Unset, the app
      # creates its own (£1 per 10 GB a month).
      - key: STORAGE_ADDON_PRICE_ID
        sync: false
      # Storage cost check (see .env.example): the provider's USD rate per
      # GiB-month (default 0.026) and USD -> GBP rate (unset assumes 1).
      - key: STORAGE_PROVIDER_USD_PER_GIB_MONTH
        sync: false
      - key: STORAGE_USD_EXCHANGE_RATE
        sync: false
      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # In-app "Submit feedback" reports are emailed here (unset = saved only
      # in the business's own feedback inbox).
      - key: FEEDBACK_RECIPIENT_EMAIL
        value: info@alpsconsultancy.co.uk
      # Sign-in emails of platform operators (comma-separated), who may repair
      # the Stripe price catalogue, issue ALPS discount codes and create
      # businesses without a trial. Unset means nobody.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Error reporting (Sentry free tier is enough): job failures, crashes,
      # website errors. The website reads it at build time, so save it with
      # "Save, rebuild, and deploy". Unset = no reports (/readyz notes it).
      - key: SENTRY_DSN
        sync: false
      # File storage (Google Cloud Storage): a bucket in europe-west3
      # (Frankfurt), e.g. /bucket/private and /bucket/public.
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      # First-party analytics: bearer token for the read-only
      # /api/internal/analytics/summary route (unset = route disabled).
      # Generate with `openssl rand -hex 32`.
      - key: ANALYTICS_READ_TOKEN
        sync: false

databases:
  - name: complytrack-db
    databaseName: complytrack
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Only Render services may connect; no public access.
    ipAllowList: []
