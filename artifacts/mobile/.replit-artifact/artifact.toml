kind = "mobile"
previewPath = "/mobile/"
title = "ComplyTrack Mobile"
description = "The ComplyTrack mobile companion app for iOS and Android. Lets field staff log daily compliance checks (fire safety, water safety, kitchen temperatures), report and track maintenance issues, view safety documents, and check training records — all connected to the same API as the web platform."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
