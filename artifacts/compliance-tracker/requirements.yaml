packages:
  "framer-motion": "For page transitions and smooth UI animations"
  "recharts": "For dashboard analytics and status distribution charts"
  "date-fns": "For human-readable date formatting and manipulation"
  "@hookform/resolvers": "Zod validation resolver for React Hook Form"
  "react-hook-form": "For robust form state management"
  "zod": "For form validation schemas"
  "lucide-react": "For beautiful consistent icons"

images:
  - path: "artifacts/compliance-tracker/public/images/dashboard-bg.png"
    description: "Abstract subtle geometric background in deep indigo and slate, clean enterprise aesthetic"
    aspect_ratio: "16:9"

notes:
  - Uses @workspace/api-client-react for TanStack Query hooks generated from OpenAPI
  - Object storage upload flow: Request presigned URL -> PUT file directly -> Save object path
  - Forms coerce numeric IDs and handle date conversions
