name: Dashboard site switching checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/dashboard.tsx"
      - "artifacts/compliance-tracker/tests/browser/dashboard*"
      - "artifacts/compliance-tracker/tests/dashboard-site-switch-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-site-switch-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/dashboard.tsx"
      - "artifacts/compliance-tracker/tests/browser/dashboard*"
      - "artifacts/compliance-tracker/tests/dashboard-site-switch-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-site-switch-browser.yml"
  workflow_dispatch:

jobs:
  dashboard-site-switch:
    name: Rapid site switching never mixes sites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dashboard site switching checks
        run: pnpm --filter @workspace/compliance-tracker run test:dashboard-site-switch-browser
