name: Sidebar browser checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/components/layout.tsx"
      - "artifacts/compliance-tracker/src/lib/nav-groups.ts"
      - "artifacts/compliance-tracker/src/context/auth-context.tsx"
      - "artifacts/compliance-tracker/src/App.tsx"
      - "artifacts/compliance-tracker/tests/sidebar-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sidebar-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/components/layout.tsx"
      - "artifacts/compliance-tracker/src/lib/nav-groups.ts"
      - "artifacts/compliance-tracker/src/context/auth-context.tsx"
      - "artifacts/compliance-tracker/src/App.tsx"
      - "artifacts/compliance-tracker/tests/sidebar-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sidebar-browser.yml"
  workflow_dispatch:

jobs:
  sidebar:
    name: Sidebar sections and pins (desktop and phone drawer)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run sidebar checks
        run: pnpm --filter @workspace/compliance-tracker run test:sidebar-browser
