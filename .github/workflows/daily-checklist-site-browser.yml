name: Daily checklist site picker checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/daily-track-am.tsx"
      - "artifacts/compliance-tracker/src/pages/room-track.tsx"
      - "artifacts/compliance-tracker/src/pages/kitchen-cleaning.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-checklist-site.ts"
      - "artifacts/compliance-tracker/src/lib/checklist-carry.ts"
      - "artifacts/compliance-tracker/src/components/checklist-site-select.tsx"
      - "artifacts/compliance-tracker/src/components/checklist-item-row.tsx"
      - "artifacts/compliance-tracker/tests/browser/daily-checklist-site*"
      - "artifacts/compliance-tracker/tests/daily-checklist-site-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/daily-checklist-site-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/daily-track-am.tsx"
      - "artifacts/compliance-tracker/src/pages/room-track.tsx"
      - "artifacts/compliance-tracker/src/pages/kitchen-cleaning.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-checklist-site.ts"
      - "artifacts/compliance-tracker/src/lib/checklist-carry.ts"
      - "artifacts/compliance-tracker/src/components/checklist-site-select.tsx"
      - "artifacts/compliance-tracker/src/components/checklist-item-row.tsx"
      - "artifacts/compliance-tracker/tests/browser/daily-checklist-site*"
      - "artifacts/compliance-tracker/tests/daily-checklist-site-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/daily-checklist-site-browser.yml"
  workflow_dispatch:

jobs:
  daily-checklist-site:
    name: Picking a site keeps checklist answers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run daily checklist site picker checks
        run: pnpm --filter @workspace/compliance-tracker run test:daily-checklist-site-browser
