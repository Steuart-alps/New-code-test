name: Email verification page checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/verify-email.tsx"
      - "artifacts/compliance-tracker/src/pages/login.tsx"
      - "artifacts/compliance-tracker/tests/verify-email-browser*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-email-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/verify-email.tsx"
      - "artifacts/compliance-tracker/src/pages/login.tsx"
      - "artifacts/compliance-tracker/tests/verify-email-browser*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-email-browser.yml"
  workflow_dispatch:

jobs:
  verify-email:
    name: Verification link and resend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run verification page checks
        run: pnpm --filter @workspace/compliance-tracker run test:verify-email-browser
