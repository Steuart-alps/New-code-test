name: CI

# The required gate for every change: typecheck, both production builds, the
# core API suites (tenant isolation, module routes, department isolation,
# enforced CSRF, stored-date locks and site moves, viewer read-only) against a
# disposable Postgres, and the production schema-shape
# checks (schema parity, dashboard accuracy on a drizzle-kit push base). The browser workflows next to
# this file stay path-filtered; this one runs on every pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Typecheck, build and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: complytrack
          POSTGRES_PASSWORD: complytrack
          POSTGRES_DB: complytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complytrack -d complytrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Disposable CI service only; never a real database or secret.
      DATABASE_URL: postgresql://complytrack:complytrack@localhost:5432/complytrack
      SESSION_SECRET: ci-only-session-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json
      # (pnpm@10.28.0, matching render.yaml).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Fails when openapi.yaml would break clients built against the agreed
      # baseline (lib/api-spec/openapi.baseline.yaml), e.g. installed phone apps.
      - name: API contract compatibility check
        run: |
          pnpm --filter @workspace/api-spec run test:contract
          pnpm run check:api-contract

      # Every /api route the server mounts must be in openapi.yaml, excluded
      # with a reason, or on the shrinking documentation backlog.
      - name: API route-to-contract inventory
        run: pnpm --filter @workspace/api-server run test:openapi-routes

      # Regenerates the API client and zod schemas from the OpenAPI spec and
      # fails if the committed output differs. Needs lib/*/dist from Typecheck.
      - name: Generated API client drift check
        run: pnpm run check:api-codegen

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Web dropdown option values test
        run: pnpm --filter @workspace/compliance-tracker run test:select-item-values

      - name: Weekly kitchen review result rule test
        run: pnpm --filter @workspace/api-zod run test:kitchen-weekly

      - name: Build web app
        env:
          PORT: "5173"
          BASE_PATH: /
        run: pnpm --filter @workspace/compliance-tracker run build

      - name: Public page SEO test
        run: pnpm --filter @workspace/compliance-tracker run test:seo-pages

      - name: Training matrix and CSV formula safety test
        run: pnpm --filter @workspace/compliance-tracker run test:training-matrix

      - name: Storage test-bucket safety checks
        run: pnpm --filter @workspace/api-server run test:storage-happy-path-config

      - name: Email design test
        run: pnpm --filter @workspace/api-server run test:email-layout

      # Real DocTrack and /documents routes against an in-memory storage and
      # database double, including a failed ACL write during registration.
      - name: Private file ACL checks
        run: pnpm --filter @workspace/api-server run test:private-file-acl

      - name: Web client CSRF header test
        run: pnpm --filter @workspace/api-client-react run test:custom-fetch-csrf

      - name: Web client override-reason retry test
        run: pnpm --filter @workspace/api-client-react run test:custom-fetch-override-reason

      - name: Upload size limit test
        run: pnpm --filter @workspace/api-server run test:upload-size-limit

      - name: Track record lock decision tests
        run: pnpm --filter @workspace/api-server run test:track-record-lock

      - name: Billing lock allowlist test
        run: pnpm --filter @workspace/api-server run test:trial-lock-allowlist

      - name: Storage add-on price check test
        run: pnpm --filter @workspace/api-server run test:storage-price-check

      - name: Calendar invite fixture test
        run: pnpm --filter @workspace/api-server run test:calendar-invite-compatibility

      - name: Generated API client runtime test
        run: pnpm --filter @workspace/api-client-react run test:generated-client

      - name: SafeTrack reminder schedule test
        run: pnpm --filter @workspace/api-zod run test:safe-track-reminder-schedule

      - name: Stripe start-up copies Stripe data into the database
        run: pnpm --filter @workspace/api-server run test:stripe-backfill-scope

      - name: Stripe Tax settings check
        run: pnpm --filter @workspace/api-server run test:stripe-tax-check

      # Same as Render's pre-deploy step: base schema on the empty database.
      # The API applies its runtime migrations when each suite boots it.
      - name: Create base database schema
        run: node lib/db/bootstrap.mjs

      - name: Tenant isolation tests
        run: pnpm --filter @workspace/api-server run test:isolation:ci

      - name: Module route tests
        run: pnpm --filter @workspace/api-server run test:modules:ci

      # Public staff sign-off link: anonymous access, expired/revoked links,
      # one-time acknowledgements and tenant/department scope.
      - name: Public sign-off link tests
        run: pnpm --filter @workspace/api-server run test:sign-off-access

      - name: Department isolation tests
        run: pnpm --filter @workspace/api-server run test:dept-isolation:ci

      - name: Welcome email and verification resend tests
        run: pnpm --filter @workspace/api-server run test:welcome-email

      - name: Water-safety department isolation tests
        run: pnpm --filter @workspace/api-server run test:water-dept-isolation:ci

      - name: Enforced CSRF tests
        run: pnpm --filter @workspace/api-server run test:csrf-enforced:ci

      - name: Settings and dropdown option tests
        run: pnpm --filter @workspace/api-server run test:config:ci

      - name: Privacy Centre and online request form tests
        run: pnpm --filter @workspace/api-server run test:privacy-governance:ci

      - name: Staff invitation tests
        run: pnpm --filter @workspace/api-server run test:staff-invitations

      # Record locks, department non-disclosure and site moves (the checks that
      # tests/site-move-route-inventory.mjs requires for every site-move route).
      - name: Stored-date lock and site-move tests
        run: pnpm --filter @workspace/api-server run test:stored-track-lock

      - name: Viewer read-only tests
        run: pnpm --filter @workspace/api-server run test:viewer-read-only

      # The schema-shape suites start their own private cluster with initdb and
      # pg_ctl, which ubuntu-latest ships (PostgreSQL 16, service disabled) but
      # not on PATH. Install the server package only if an image drops it.
      - name: Put PostgreSQL server tools on PATH
        run: |
          bin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" --version

      # A drizzle-kit push database and a runtime-migrations-only one must end
      # with the same columns (production is built the push way).
      - name: Schema parity test
        run: pnpm --filter @workspace/api-server run test:schema:parity

      - name: SafeTrack reminder job tests (fresh schema)
        run: pnpm --filter @workspace/api-server run test:safe-track-ack-reminders:fresh

      # Older, populated databases (Replit-era table layouts) must keep every
      # record through the runtime migrations, readable through today's routes.
      - name: Upgrade-path fixture tests
        run: pnpm --filter @workspace/api-server run test:schema:upgrade

      - name: Dashboard accuracy tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:dashboard-accuracy:pushed

      - name: Checklist results and FixTrack job tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:checklist-results-fixtrack

      - name: Owner late-edit reason tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:owner-late-edit-reason

      - name: Departments under sites tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:departments-under-sites

      - name: Hot tub registry search tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:hot-tub-registry:pushed

      - name: Account-level cleaning records test (production schema base)
        env:
          FRESH_SCHEMA_BASE: push
        run: pnpm --filter @workspace/api-server run test:kitchen-cleaning-legacy

      - name: Public-link access history tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:public-link-access

      - name: Shared public-link rate limit tests (two API instances)
        run: pnpm --filter @workspace/api-server run test:public-link-rate-limit

      - name: Contractor portal tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:contractor-portal:pushed

      # Warning job and banner against synced Stripe rows in the current API shape.
      - name: Cancellation warning tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:cancellation-warnings:fresh

      # Reviewed account deletion: no purge before approval, the 30-day wait or
      # with a legal hold; only the tenant's ACL-owned files; durable outcome.
      - name: Approved account deletion tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:approved-account-deletion

      - name: Client data deletion completeness tests (fresh schema)
        run: pnpm --filter @workspace/api-server run test:client-data-deletion-feedback

      # Cancelled businesses' files: cold storage after 30 days, back on
      # reactivation, only their own ACL-owned files.
      - name: Cancelled business storage class tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:cancelled-storage-class

      # Only the business's owner can ask for deletion, after cancelling.
      - name: Data deletion request tests
        run: pnpm --filter @workspace/api-server run test:data-deletion-request

      # One reminder with the download link 30 days before the 12-month deletion.
      - name: Deletion reminder email tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:deletion-reminder

      # One email to owners and admins per crossing of the storage warning level.
      - name: Storage warning email tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:storage-warning-emails

      # Uploads stop at the paid storage unless the owner switched on automatic
      # 10 GB top-up; also storage pricing and download metering.
      - name: Storage limit and metering tests
        run: pnpm --filter @workspace/api-server run test:storage-metering

      # Large exports come as numbered parts; every file is in exactly one.
      - name: Export in parts tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:export-parts

      - name: FireTrack call point and night staff tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:fire-call-points

      - name: FireTrack discharge test and ComplyTrack task link tests (production schema base)
        run: pnpm --filter @workspace/api-server run test:fire-discharge-task-link

      - name: FireTrack and Water Safety contractor jobs kept in step with ComplyTrack tasks (production schema base)
        run: pnpm --filter @workspace/api-server run test:track-task-links

      - name: PestTrack, PremisesTrack and GreenTrack due dates and the contractor reminder lead time (production schema base)
        run: pnpm --filter @workspace/api-server run test:track-due-dates

      - name: Contractor visits on every track reach the contractor reminder (production schema base)
        run: pnpm --filter @workspace/api-server run test:contractor-visits

      # KitchenTrack numeric controls: the shared rule model and country
      # presets, then hold-time boundaries, retries and the corrective-action
      # follow-up, each on its own fresh database.
      - name: KitchenTrack hold-time and temperature-action tests
        run: |
          pnpm --filter @workspace/api-zod run test:kitchen-temperature
          pnpm --filter @workspace/api-zod run test:kitchen-temperature-guidance
          pnpm --filter @workspace/api-server run test:kitchen-hold-controls
          pnpm --filter @workspace/api-server run test:kitchen-temperature-actions
          pnpm --filter @workspace/api-server run test:kitchen-mobile-replay
