name: Department dropdown browser checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/doc-track.tsx"
      - "artifacts/compliance-tracker/src/pages/staff-roster.tsx"
      - "artifacts/compliance-tracker/src/components/department-name-select.tsx"
      - "artifacts/compliance-tracker/src/components/pick-or-type-select.tsx"
      - "artifacts/compliance-tracker/tests/department-dropdowns-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/department-dropdowns-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/doc-track.tsx"
      - "artifacts/compliance-tracker/src/pages/staff-roster.tsx"
      - "artifacts/compliance-tracker/src/components/department-name-select.tsx"
      - "artifacts/compliance-tracker/src/components/pick-or-type-select.tsx"
      - "artifacts/compliance-tracker/tests/department-dropdowns-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/department-dropdowns-browser.yml"
  workflow_dispatch:

jobs:
  department-dropdowns:
    name: Department dropdowns list set-up departments
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run department dropdown checks
        run: pnpm --filter @workspace/compliance-tracker run test:department-dropdowns-browser
