name: Hot tub inspection PDF download

# Runs only when the PDF download code, its test or dependencies change, so
# ordinary PRs spend no extra CI minutes on it.
on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/hot-tub.tsx"
      - "artifacts/compliance-tracker/src/lib/hot-tub-log-pdf.ts"
      - "artifacts/compliance-tracker/src/lib/download.ts"
      - "artifacts/compliance-tracker/tests/hot-tub-pdf-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hot-tub-pdf-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/hot-tub.tsx"
      - "artifacts/compliance-tracker/src/lib/hot-tub-log-pdf.ts"
      - "artifacts/compliance-tracker/src/lib/download.ts"
      - "artifacts/compliance-tracker/tests/hot-tub-pdf-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hot-tub-pdf-browser.yml"
  workflow_dispatch:

jobs:
  pdf-download:
    name: ${{ matrix.browser }} direct PDF download
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Installs the engine and its native libraries (GTK for Firefox, the
      # GStreamer/GLES sonames for WebKit). A missing engine fails the job.
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run inspection PDF download checks
        env:
          HOT_TUB_BROWSER: ${{ matrix.browser }}
        run: pnpm --filter @workspace/compliance-tracker run test:hot-tub-pdf
