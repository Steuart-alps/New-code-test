name: Custom option form checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/components/contractor-form-dialog.tsx"
      - "artifacts/compliance-tracker/src/pages/contractors.tsx"
      - "artifacts/compliance-tracker/src/pages/contractor-detail.tsx"
      - "artifacts/compliance-tracker/src/pages/premises-track.tsx"
      - "artifacts/compliance-tracker/src/components/form-options-editor.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-form-options.ts"
      - "artifacts/compliance-tracker/src/hooks/use-active-client-api.ts"
      - "artifacts/compliance-tracker/src/context/auth-context.tsx"
      - "artifacts/compliance-tracker/src/lib/api.ts"
      - "artifacts/compliance-tracker/tests/custom-option-forms-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/custom-option-forms-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/components/contractor-form-dialog.tsx"
      - "artifacts/compliance-tracker/src/pages/contractors.tsx"
      - "artifacts/compliance-tracker/src/pages/contractor-detail.tsx"
      - "artifacts/compliance-tracker/src/pages/premises-track.tsx"
      - "artifacts/compliance-tracker/src/components/form-options-editor.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-form-options.ts"
      - "artifacts/compliance-tracker/src/hooks/use-active-client-api.ts"
      - "artifacts/compliance-tracker/src/context/auth-context.tsx"
      - "artifacts/compliance-tracker/src/lib/api.ts"
      - "artifacts/compliance-tracker/tests/custom-option-forms-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/custom-option-forms-browser.yml"
  workflow_dispatch:

jobs:
  custom-option-forms:
    name: Record forms follow active and disabled option rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run custom option form checks
        run: pnpm --filter @workspace/compliance-tracker run test:custom-option-forms-browser
