name: Form options editor checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/components/form-options-editor.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-form-options.ts"
      - "artifacts/compliance-tracker/tests/form-options-editor-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/form-options-editor-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/components/form-options-editor.tsx"
      - "artifacts/compliance-tracker/src/hooks/use-form-options.ts"
      - "artifacts/compliance-tracker/tests/form-options-editor-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/form-options-editor-browser.yml"
  workflow_dispatch:

jobs:
  form-options-editor:
    name: Disabled options survive the editor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run form options editor checks
        run: pnpm --filter @workspace/compliance-tracker run test:form-options-editor-browser
