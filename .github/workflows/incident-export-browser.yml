name: Incident register export checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/incidents.tsx"
      - "artifacts/compliance-tracker/src/lib/download.ts"
      - "artifacts/compliance-tracker/tests/incident-export-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/incident-export-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/incidents.tsx"
      - "artifacts/compliance-tracker/src/lib/download.ts"
      - "artifacts/compliance-tracker/tests/incident-export-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/incident-export-browser.yml"
  workflow_dispatch:

jobs:
  incident-export:
    name: Export matches on-screen filters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run incident export checks
        run: pnpm --filter @workspace/compliance-tracker run test:incident-export-browser
