name: Compliance check details browser checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/item-detail.tsx"
      - "artifacts/compliance-tracker/src/components/item-form-dialog.tsx"
      - "artifacts/compliance-tracker/tests/check-details-edit-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/check-details-edit-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/item-detail.tsx"
      - "artifacts/compliance-tracker/src/components/item-form-dialog.tsx"
      - "artifacts/compliance-tracker/tests/check-details-edit-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/check-details-edit-browser.yml"
  workflow_dispatch:

jobs:
  check-details-edit:
    name: Compliance check details open the edit form
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run compliance check details checks
        run: pnpm --filter @workspace/compliance-tracker run test:check-details-edit-browser
