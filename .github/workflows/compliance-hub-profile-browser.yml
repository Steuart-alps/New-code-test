name: Compliance Hub profile browser checks

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/pages/compliance-hub.tsx"
      - "artifacts/compliance-tracker/src/components/ui/input.tsx"
      - "artifacts/compliance-tracker/tests/compliance-hub-profile-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/compliance-hub-profile-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/pages/compliance-hub.tsx"
      - "artifacts/compliance-tracker/src/components/ui/input.tsx"
      - "artifacts/compliance-tracker/tests/compliance-hub-profile-browser.test.mjs"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/compliance-hub-profile-browser.yml"
  workflow_dispatch:

jobs:
  compliance-hub-profile:
    name: Compliance Hub profile boxes can be typed over
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Compliance Hub profile checks
        run: pnpm --filter @workspace/compliance-tracker run test:compliance-hub-profile-browser
