name: New rows get the cursor

on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/hooks/use-focus-new-row.ts"
      - "artifacts/compliance-tracker/src/components/string-list-editor.tsx"
      - "artifacts/compliance-tracker/src/components/pat-track/**"
      - "artifacts/compliance-tracker/src/pages/pat-track.tsx"
      - "artifacts/compliance-tracker/tests/focus-new-row-*"
      - "artifacts/compliance-tracker/tests/pat-legacy-register-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/focus-new-row-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/hooks/use-focus-new-row.ts"
      - "artifacts/compliance-tracker/src/components/string-list-editor.tsx"
      - "artifacts/compliance-tracker/src/components/pat-track/**"
      - "artifacts/compliance-tracker/src/pages/pat-track.tsx"
      - "artifacts/compliance-tracker/tests/focus-new-row-*"
      - "artifacts/compliance-tracker/tests/pat-legacy-register-*"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/focus-new-row-browser.yml"
  workflow_dispatch:

jobs:
  focus-new-row:
    name: Add puts the cursor in the new row
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run new-row cursor checks
        run: pnpm --filter @workspace/compliance-tracker run test:focus-new-row-browser

      - name: Run PATrack register checks
        run: pnpm --filter @workspace/compliance-tracker run test:pat-legacy-register-browser
