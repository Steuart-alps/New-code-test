name: Drag and drop photos

# Runs only when the drag-and-drop code, its test or dependencies change, so
# ordinary PRs spend no extra CI minutes on it. WebKit stands in for Safari.
on:
  pull_request:
    paths:
      - "artifacts/compliance-tracker/src/hooks/use-file-drop.ts"
      - "artifacts/compliance-tracker/src/lib/media-upload.ts"
      - "artifacts/compliance-tracker/src/components/pending-media-picker.tsx"
      - "artifacts/compliance-tracker/tests/file-drop-browser.test.mjs"
      - "artifacts/compliance-tracker/tests/file-drop-harness.tsx"
      - "artifacts/compliance-tracker/tests/file-drop-harness.html"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/file-drop-browser.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/compliance-tracker/src/hooks/use-file-drop.ts"
      - "artifacts/compliance-tracker/src/lib/media-upload.ts"
      - "artifacts/compliance-tracker/src/components/pending-media-picker.tsx"
      - "artifacts/compliance-tracker/tests/file-drop-browser.test.mjs"
      - "artifacts/compliance-tracker/tests/file-drop-harness.tsx"
      - "artifacts/compliance-tracker/tests/file-drop-harness.html"
      - "artifacts/compliance-tracker/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/file-drop-browser.yml"
  workflow_dispatch:

jobs:
  file-drop:
    name: ${{ matrix.browser }} drag and drop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run drag and drop checks
        env:
          FILE_DROP_BROWSER: ${{ matrix.browser }}
        run: pnpm --filter @workspace/compliance-tracker run test:file-drop-browser
